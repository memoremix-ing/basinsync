[package]
name = "basinsync"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
basinsync-structures = { path = "crates/structures" }
anyhow = "1"
hmac = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tempfile = "3"
turso_core = { path = "vendor/turso/core", default-features = false, features = ["fs", "conn_raw_api"] }
base64 = "0.22"
flexbuffers = "25.12.19"
serde_bytes = "0.11"
axum = { version = "0.8", features = ["multipart"] }
num-bigint = "0.4"
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32c = "=0.6.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
proptest = "1"
# Tests spend most of their time inside Turso; optimize dependencies only.
[profile.dev.package."*"]
opt-level = 2

[workspace]
members = ["crates/structures"]
exclude = ["vendor/turso"]
resolver = "3"
