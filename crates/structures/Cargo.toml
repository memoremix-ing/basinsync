[package]
name = "basinsync-structures"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
[features]
profile = []
[dependencies]
anyhow = "1"
base64 = "0.22"
crc-fast = { version = "=1.10.0", default-features = false, features = ["std"] }
flexbuffers = "25.12.19"
hmac = "0.12"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
