},{"suite":"capabilities","layout":"lexidecimal","variant":"optimized-consumer-off","entries":100000,"rounds":5,"build_ms":63.46504100000001,"build_min_ms":62.410834,"build_max_ms":69.332583,"get_us":0.38891363143920904,"get_min_us":0.3797968254089356,"get_max_us":0.40497605133056636},{"suite":"capabilities","layout":"lexidecimal","variant":"optimized-metadata-off","entries":100000,"rounds":5,"build_ms":60.332375,"build_min_ms":57.23325,"build_max_ms":63.303417,"get_us":0.385848201751709,"get_min_us":0.3837458305358887,"get_max_us":0.39315255737304683},{"suite":"capabilities","layout":"lexidecimal","variant":"collection","entries":100000,"rounds":5,"build_ms":66.84541700000001,"build_min_ms":64.26533400000001,"build_max_ms":82.74254100000002,"get_us":0.2706445083618164,"get_min_us":0.267197769165039,"get_max_us":0.31005080413818364}];const get=(s,v,l)=>{const r=data.find(r=>r.suite===s&&r.variant===v&&r.layout===l);if(!r)throw Error('missing '+[s,v,l]);return r},n=(v,d=1)=>v.toFixed(d);function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function panel(view,l){if(view==='capabilities'){const old=get('capabilities','baseline',l),bare=get('capabilities','metadata-off',l),fast=get('capabilities','optimized',l),fastBare=get('capabilities','optimized-metadata-off',l),collection=get('capabilities','collection',l);return table(['Builder','Full features · ms','Bounds / aggregation disabled · ms'],[['Original passes','<strong>'+n(old.build_ms)+'</strong>',n(bare.build_ms)],['Single-pass buckets + sorted endpoints','<strong>'+n(fast.build_ms)+'</strong>',n(fastBare.build_ms)]])+'<p class="insight">Keeping the features and changing the passes saves <b>'+n(old.build_ms-fast.build_ms)+' ms</b>. Removing richer metadata saves '+n(old.build_ms-bare.build_ms)+' ms with the old builder, '+n(fast.build_ms-fastBare.build_ms)+' ms with the optimized builder. The effects interact.</p><p class="insight">Contemporaneous adapted collection.ts control: <b>'+n(collection.build_ms)+' ms</b>.</p><details><summary>Subdivide the metadata capability</summary>'+table(['Builder / disabled capability','Build · ms'],[['Original / neither',n(old.build_ms)],['Original / header scans',n(get('capabilities','headers-off',l).build_ms)],['Original / consumer aggregation',n(get('capabilities','consumer-off',l).build_ms)],['Original / both',n(bare.build_ms)],['Optimized / neither',n(fast.build_ms)],['Optimized / header scans',n(get('capabilities','optimized-headers-off',l).build_ms)],['Optimized / consumer aggregation',n(get('capabilities','optimized-consumer-off',l).build_ms)],['Optimized / both',n(fastBare.build_ms)]])+'</details><p class="scope">Disabled controls omit bounds/nullity scans and consumer entry/combine work; prefix/count/packing fields remain. These diagnostic controls are not publication formats. Differences are wall-clock controls, not additive CPU accounting.</p>'}
if(view==='construction'){const variants=[['baseline','Original'],['endpoints','Common prefix + bounds from sorted endpoints'],['partition','Single-pass high/low nibble bucketing'],['endpoints-partition','Both']];return table(['All metadata retained','Build · ms'],variants.map(([v,label])=>[label,'<strong>'+n(get('construction',v,l).build_ms)+'</strong>']))+'<p class="insight">Sorted endpoints determine the common prefix and key bounds. One partition replaces repeated 16-way filtering. The combination preserves the exact serialized graph.</p><p class="scope">Verified 44 canonical graph comparisons, including empty/prefix keys, 255/256 and 1280/1281 boundaries, random/ordered keys and asynchronous aggregation. This suite is separate from the capability matrix; medians vary slightly.</p>'}
const variants=[['baseline','Original'],['hoisted-find','Hoist group-search closure'],['manual-prefix','Manual prefix loop'],['offset-only','Offset suffix comparisons'],['offset-combined','Combined offset reader'],['collection','Adapted collection.ts']];return table(['Reader','Get · µs'],variants.map(([v,label])=>[label,'<strong>'+n(get('readers',v,l).get_us,3)+'</strong>']))+'<p class="insight">The largest isolated improvement is representing the remaining key by a byte offset. The combined loop also uses a manual prefix scan, shared finder and fixed comparison length. Hoisting the finder alone has no clear benefit.</p><p class="scope">Same 262,144 checked reads over the same 64-key hot set. Separately verified 4,442 hits, misses and prefixes. Results describe live logical objects, not FlexBuffers parsing. Deferring physical cuts and using direct logical references is a further architectural control.</p>'}
function render(){document.getElementById('content').innerHTML=panel(document.getElementById('view').value,document.getElementById('layout').value)}for(const el of document.querySelectorAll('select'))el.addEventListener('change',render);console.assert(data.length===44,'summary count');for(const l of ['random','lexidecimal'])for(const v of ['capabilities','construction','readers'])console.assert(!/NaN|undefined|Infinity/.test(panel(v,l)),'invalid panel');render();console.log('Verified 44 summary groups and six panels.');</script></body></html>
